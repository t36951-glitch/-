<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#dff5e5" />
    <title>숲속 글자마을 · 1단계</title>
  </head>
  <body>
    <main id="game-shell" aria-label="숲속 글자마을 탑다운 RPG">
      <canvas id="game-canvas"></canvas>
      <div class="vignette"></div>
      <section class="hud hud-top-left" aria-label="캐릭터 정보">
        <div class="avatar">다</div>
        <div class="character-info">
          <div class="name-row"><strong>다온</strong><span>Lv. 1</span></div>
          <div class="health-track" aria-label="체력 100%"><div class="health-fill"></div></div>
          <div class="energy-row" aria-label="학습 도전 에너지"><span>에너지</span><div class="energy-pips" id="energy-pips"><i></i><i></i><i></i><i></i><i></i></div><strong id="energy-count">5/5</strong></div>
          <small>숲속 글자마을</small>
        </div>
      </section>
      <section class="hud hud-top-right" aria-label="게임 메뉴">
        <button class="round-ui" aria-label="메뉴">☰</button>
        <button class="round-ui" aria-label="설정">⚙</button>
      </section>
      <div class="location-pill"><span class="dot"></span> 반짝숲 마을</div>
      <section class="word-progress" aria-label="글자 수집 진행">
        <div class="word-goal"><span>목표 단어</span><strong>사과</strong></div>
        <div class="word-collected"><span>수집한 글자</span><strong id="collected-letters">아직 없어요</strong></div>
        <div class="word-count"><span id="letter-count">0/2</span></div>
        <div class="word-next"><span>현재 찾아야 하는 글자</span><strong id="next-letter">사</strong></div>
        <div class="word-state"><span>상태</span><strong id="word-state">글자를 모아 보세요!</strong><button id="retry-collect" type="button">다시 모으기</button></div>
      </section>
      <div id="door-notice" class="door-notice" role="status" aria-live="polite">집 안으로 들어가는 기능은 다음 단계에서 추가됩니다.</div>
      <div id="letter-notice" class="letter-notice" role="status" aria-live="polite"></div>
      <section id="hint-overlay" class="hint-overlay" aria-live="polite" hidden>
        <div class="hint-card">
          <button id="hint-close" class="hint-close" type="button" aria-label="힌트 닫기">닫기</button>
          <div class="hint-apple" aria-hidden="true">🍎</div>
          <h2>사과 힌트</h2>
          <p>빨갛고 맛있는 과일이에요.</p>
          <div class="hint-goal">목표 단어: <strong>사과</strong></div>
          <div id="hint-current" class="hint-current">첫 번째 글자는 ‘사’예요.</div>
        </div>
      </section>
      <div id="rest-countdown" class="rest-countdown" role="status" aria-live="polite" hidden><strong id="rest-countdown-number">5</strong><span>집에서 쉬는 중</span></div>
      <section id="success-overlay" class="success-overlay" aria-live="polite" hidden>
        <div class="success-card">
          <div class="success-spark">✦</div>
          <h1>사과 낱말 미션 성공!</h1>
          <p>글자를 모아 문을 통과했어요.</p>
          <button id="retry-button" type="button">다시 도전하기</button>
        </div>
      </section>
      <section class="controls" aria-label="이동 조작">
        <div class="joystick" id="joystick" aria-label="가상 방향 패드">
          <div class="joy-ring"><div class="joy-stick"></div></div>
          <span class="joy-label up">▲</span><span class="joy-label down">▼</span><span class="joy-label left">◀</span><span class="joy-label right">▶</span>
        </div>
        <div class="skill-tray" aria-label="스킬 자리표시자">
          <button class="skill-slot" aria-label="스킬 준비 중"></button><button class="skill-slot" aria-label="스킬 준비 중"></button>
          <button class="skill-slot" aria-label="스킬 준비 중"></button><button class="skill-slot" aria-label="스킬 준비 중"></button>
        </div>
      </section>
      <div class="help-toast"><span class="key-hint">WASD</span><span>또는 방향키로 산책해요</span></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
